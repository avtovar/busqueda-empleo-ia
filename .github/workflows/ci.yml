name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancelar corridas anteriores en la misma rama/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nunca poner secretos reales aquí. En PRs de fork no hay acceso a secrets.
  # Estos son placeholders para que los pasos que leen process.env no fallen.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test?sslmode=disable"
  SESSION_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  LLM_API_KEY: "test-key"
  LLM_BASE_URL: "http://127.0.0.1:4000/v1"
  APIFY_API_TOKEN: ""
  APIFY_DAILY_LIMIT: "3"
  CV_PARSE_LIMIT: "5"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # 1. GUARD ANTI-COBRO (siempre, en cada PR) — SE EJECUTA PRIMERO
  # ═══════════════════════════════════════════════════════════════════════════
  # Falla el job si APIFY_API_TOKEN está definido en el entorno del PR,
  # y escanea tokens reales de Apify (prefijo apifsk_) en archivos versionados.
  # Ver AGENTS.md § "La regla que más cuesta aprender" y MEMORIA.md §4.1.
  # ═══════════════════════════════════════════════════════════════════════════
  guard-anti-cobro:
    name: Guard anti-cobro Apify + secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para grep en historial si se desea

      - name: Verificar que APIFY_API_TOKEN NO está en secrets del PR
        # En PRs de fork, GitHub NO expone los secrets del repo base.
        # Si este paso ve la variable, es que alguien la puso en el PR (mal) o en el repo (peor).
        run: |
          # En PRs, los secrets del repo base NO están disponibles por seguridad.
          # Si APIFY_API_TOKEN aparece, es que alguien lo puso en el PR (variables de entorno del PR).
          if [ -n "${{ secrets.APIFY_API_TOKEN }}" ] && [ "${{ secrets.APIFY_API_TOKEN }}" != "" ]; then
            echo "❌ FALLA: APIFY_API_TOKEN está definido en los secrets del PR/repo."
            echo "   Esto NO debe pasar: la clave de Apify NUNCA va en CI."
            echo "   En Vercel se configura en Settings > Environment Variables."
            exit 1
          fi
          echo "✅ APIFY_API_TOKEN no está en secrets del PR."

      - name: Escanear tokens reales de Apify en archivos versionados (grep apifsk_)
        # El prefijo real de los tokens de Apify es apifsk_ seguido de caracteres alfanuméricos.
        # Un token real: apifsk_xxxxxxxxxxxx. Las referencias en docs/comentarios solo dicen "apifsk_".
        # Si alguien commiteó uno por error, esto lo detecta ANTES de que llegue a main.
        run: |
          # grep robusto: busca patrón de token REAL (apifsk_ + alfanuméricos), ignora docs y workflow
          if grep -rE "apifsk_[a-zA-Z0-9]+" \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=.vercel \
            --exclude-dir=dist \
            --exclude-dir=build \
            --exclude-dir=.github \
            --exclude-dir=docs \
            --exclude=*.lock \
            --exclude=package-lock.json \
            --exclude=yarn.lock \
            --exclude=pnpm-lock.yaml \
            --exclude=*.md \
            --binary-files=without-match \
            .; then
            echo "❌ FALLA: Se encontró token REAL de Apify (patrón apifsk_[a-zA-Z0-9]+) en archivos versionados."
            echo "   Rotalo YA en Apify y bórralo del historial con git filter-repo o BFG."
            exit 1
          fi
          echo "✅ No hay tokens reales de Apify en el repo."

      - name: Activar secret scanning nativo de GitHub (informativo)
        # No falla el job; solo avisa. La protección real está en los dos pasos de arriba.
        run: |
          echo "ℹ️  Recordá activar en Settings > Code security:"
          echo "   - Secret scanning"
          echo "   - Push protection"
          echo "   Esto bloquea pushes con secretos ANTES de que entren al repo."

  # ═══════════════════════════════════════════════════════════════════════════
  # 2. LINT + CHECK + BUILD (rápido, sin base de datos)
  # ═══════════════════════════════════════════════════════════════════════════
  lint-check-build:
    name: Lint + Check + Build
    runs-on: ubuntu-latest
    needs: guard-anti-cobro  # Solo corre si el guard pasó
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies (root + frontend workspace)
        run: npm ci

      - name: ESLint + jsx-a11y (frontend)
        run: npx eslint frontend/src --ext .js,.jsx --max-warnings=0
        continue-on-error: false

      - name: Check sintaxis backend (npm run check)
        run: npm run check

      - name: Build frontend (npm run build)
        run: npm run build

# ══════════════════════════════════════════════════════════════════════════
  # 3. TESTS CON POSTGRES + LLM FALSO (bloqueantes)
  # ═════════════════════════════════════════════════════════════════════════
  # Los tests son un gate de CI: un error debe bloquear el merge/deploy.
  # ═════════════════════════════════════════════════════════════════════════
  tests:
    name: Tests (Postgres + LLM falso)
    runs-on: ubuntu-latest
    needs: lint-check-build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Esperar Postgres listo
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U postgres; then break; fi
            sleep 1
          done

      - name: Correr migraciones
        run: npm run migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test?sslmode=disable

      - name: Levantar servidor LLM falso (OpenAI-compatible en :4000)
        # Responde un chat.completion válido para cualquier request.
        # Ver AGENTS.md: LLM_BASE_URL se lee en CADA llamada, no al importar.
        run: |
          cat > fake-llm.js << 'EOF'
          import { createServer } from 'node:http';
          const server = createServer(async (req, res) => {
            if (req.method === 'POST' && req.url === '/v1/chat/completions') {
              let body = '';
              for await (const chunk of req) body += chunk;
              res.writeHead(200, { 'Content-Type': 'application/json' });
              res.end(JSON.stringify({
                id: 'test-cmpl', object: 'chat.completion', created: Date.now(),
                model: 'fake', choices: [{
                  index: 0, message: { role: 'assistant', content: JSON.stringify({
                    fullName: 'Test User', title: 'QA Engineer', yearsExperience: 3,
                    summary: 'Test summary', photo: null, location: 'Buenos Aires, Argentina',
                    skills: [{name: 'Cypress', weight: 0.95}, {name: 'Playwright', weight: 0.9}],
                    keywords: ['qa', 'testing', 'automation'], marketSkills: [], projects: []
                  }) }, finish_reason: 'stop'
                }], usage: { prompt_tokens: 100, completion_tokens: 200, total_tokens: 300 }
              }));
            } else {
              res.writeHead(404); res.end();
            }
          });
          server.listen(4000, () => console.log('Fake LLM listening on :4000'));
          EOF
          node fake-llm.js &
          # Esperar a que el servidor esté listo
          for i in {1..10}; do
            if curl -sf http://127.0.0.1:4000/v1/chat/completions -X POST -H "Content-Type: application/json" -d '{"model":"fake","messages":[]}' >/dev/null; then
              echo "Fake LLM ready"
              break
            fi
            sleep 1
          done

      - name: Correr tests (node:test)
        run: npm run test -- --test-reporter=verbose
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test?sslmode=disable
          SESSION_SECRET: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          LLM_API_KEY: "test-key"
          LLM_BASE_URL: "http://127.0.0.1:4000/v1"
          APIFY_API_TOKEN: ""
          CV_PARSE_LIMIT: "0"  # Sin límite en tests

  # ═══════════════════════════════════════════════════════════════════════════
  # 4. NPM AUDIT (vulnerabilidades)
  # ═══════════════════════════════════════════════════════════════════════════
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    needs: lint-check-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Audit (solo high/critical, no falla en moderate/low)
        run: npm audit --audit-level=high || echo "⚠️ Vulnerabilidades encontradas (no bloquea el build)"

  # ═══════════════════════════════════════════════════════════════════════════
  # 5. POST-DEPLOY SMOKE TEST (solo en push a main, tras deploy de Vercel)
  # ═══════════════════════════════════════════════════════════════════════════
  # Requiere configurar VERCEL_PROJECT_ID y VERCEL_TOKEN en secrets del repo.
  # Descomentá y completá cuando tengas el deploy en Vercel.
  # smoke-test:
  #   name: Smoke test post-deploy
  #   if: github.ref == 'refs/heads/main' && github.event_name == 'push'
  #   runs-on: ubuntu-latest
  #   needs: tests
  #   steps:
  #     - name: Wait for Vercel deploy
  #       uses: actions/checkout@v4
  #       # Aquí iría la lógica para obtener la URL del preview/deploy
  #     - name: curl /api/health
  #       run: curl -fsS https://${{ env.VERCEL_URL }}/api/health | jq -e '.ok == true'